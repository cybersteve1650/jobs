:root{

  --green:#0B6B4F; --green-bg:#E6F4EE;
  --purple:#59379E; --purple-bg:#F1ECFB;

}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);background:var(--paper);color:var(--ink);

a{color:var(--red);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px}

header{background:#27323A;color:#fff;padding:30px 0 26px;border-bottom:5px solid var(--red)}
.headtop{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.brandline{display:flex;align-items:center;gap:10px;margin-bottom:15px}
.brandmark{width:24px;height:24px;background:var(--red);border-radius:26%;flex:none}
.brandtext{font-size:11px;letter-spacing:.15em;text-transform:uppercase;font-weight:bold;color:#E1DDD7}
h1{margin:0 0 6px;font-size:31px;line-height:1.15;letter-spacing:-.025em;color:#fff}
.sub{margin:0;color:#AEB9C0;font-size:13.5px}
.stats{display:flex;gap:36px;margin-top:22px}
.stat b{display:block;font-size:27px;line-height:1.1;letter-spacing:-.02em;color:#fff}
.stat span{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:#8E9BA3}
.langsw{display:inline-flex;background:rgba(255,255,255,.09);border-radius:9px;padding:3px;flex:none}
.langsw button{border:none;background:none;padding:6px 13px;border-radius:7px;
  font-size:12.5px;color:#C4CDD3;transition:.12s}
.langsw button[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:bold}

.controls{position:sticky;top:0;z-index:20;background:var(--paper);
  border-bottom:1px solid var(--line);padding:13px 0}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--white);border:1px solid var(--line);
  border-radius:11px;padding:3px}
.seg button{border:none;background:none;padding:8px 16px;border-radius:8px;font-size:13.5px;
  color:var(--muted);transition:.12s;display:inline-flex;align-items:center;gap:7px}
.seg button .ico{font-size:14px;filter:grayscale(1);opacity:.65}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;font-weight:bold}
.seg button[aria-pressed="true"] .ico{filter:none;opacity:1}
.rightgrp{display:flex;align-items:center;gap:12px}
.count{font-size:13px;color:var(--muted)}
.count b{color:var(--ink)}
.collapse{display:inline-flex;align-items:center;gap:7px;background:var(--white);
  border:1px solid var(--line);border-radius:10px;padding:8px 13px;font-size:13px}
.collapse:hover{border-color:#CDC7BE}
.collapse .badge{background:var(--red);color:#fff;border-radius:999px;font-size:10.5px;
  font-weight:bold;padding:1px 7px;display:none}
.collapse.active .badge{display:inline-block}
.collapse .arrow{transition:transform .18s;font-size:10px;color:var(--muted)}
.controls.folded .collapse .arrow{transform:rotate(-90deg)}

.body{overflow:hidden;margin-top:12px;
  transition:max-height .22s ease,opacity .16s,margin-top .22s}
.controls.folded .body{max-height:0!important;opacity:0;margin-top:0}
.filterline{display:flex;gap:9px;flex-wrap:wrap}
.search{flex:1 1 260px}
.search input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;
  background:var(--white);font-size:15px;color:var(--ink)}
select{padding:11px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--white);color:var(--ink);font-size:13.5px}
.chiprow{display:flex;align-items:center;gap:12px;margin-top:11px}
.rowlabel{flex:none;width:100px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  font-weight:bold;color:var(--muted)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0;scrollbar-width:thin}
.chip{white-space:nowrap;padding:6px 13px;border:1px solid var(--line);background:var(--white);
  border-radius:999px;color:var(--muted);font-size:12.5px;transition:.12s}
.chip small{opacity:.6;margin-left:5px;font-size:11px}
.chip:hover{border-color:#CDC7BE}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff;font-weight:bold}
.chip[aria-pressed="true"] small{opacity:.8}
#chipsType .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.clearrow{text-align:right;margin-top:9px}
.clear{background:none;border:none;color:var(--red);font-size:12.5px;padding:0}

main{padding:22px 0 70px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:11px}
.card{text-align:left;width:100%;background:var(--white);border:1px solid var(--line);
  border-radius:13px;padding:16px 17px;transition:.13s;display:flex;flex-direction:column}
.card:hover{border-color:var(--red);box-shadow:0 5px 16px rgba(27,36,44,.08);transform:translateY(-1px)}
.cname{font-size:16px;font-weight:bold;letter-spacing:-.01em;line-height:1.25}
.csector{font-size:11.5px;color:var(--muted);margin-top:2px}
.role{font-size:14.5px;color:var(--ink-soft);margin-top:8px;line-height:1.4}
.pay{color:var(--green);font-weight:bold;font-size:14px;margin-top:7px}
.desc{font-size:13px;color:var(--muted);margin-top:9px;line-height:1.5}
.pins{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px}
.pill{font-size:11px;border-radius:6px;padding:3px 8px;font-weight:bold;white-space:nowrap}
.p-green{background:var(--green-bg);color:var(--green)}
.p-purple{background:var(--purple-bg);color:var(--purple)}
.p-amber{background:var(--amber-bg);color:var(--amber)}
.p-grey{background:#F0EFEC;color:var(--muted)}
.loc{font-size:12.5px;color:var(--muted)}
.cardfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;

.jd{font-size:12px;font-weight:bold;color:var(--red);white-space:nowrap}
.jd:hover{text-decoration:underline}
.card{cursor:pointer}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;

.foot .n{color:var(--red);font-weight:bold}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}

.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin:22px 0;overflow-x:auto}

.line .ico{flex:none;width:17px;text-align:center}

.btn.ghost{background:var(--white)}
.btn.ghost:hover{text-decoration:none;border-color:var(--red);color:var(--red)}
footer{border-top:1px solid var(--line);padding:24px 0 40px;color:var(--muted);font-size:12.5px}

  .wrap{padding:0 15px}
  h1{font-size:22px} .dhead h2{font-size:20px} .grid2{grid-template-columns:1fr}

  header{padding:22px 0 20px}

  .grid{grid-template-columns:1fr;gap:9px}

  .search{grid-column:1/-1}
  select{width:100%;padding:10px}
  .chiprow{display:block;margin-top:10px}
  .rowlabel{width:auto;margin-bottom:6px}
  .chips{margin:0 -15px;padding:2px 15px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const state = {q:"", tags:new Set(), types:new Set(), jp:"", pay:0, rem:"",
               view:"role", lang:"en", folded:window.innerWidth < 760,
               openRole:null, openCo:null, tab:0};
const L = () => I18N[state.lang];
const t = (k, v={}) => Object.entries(v).reduce((s,[a,b]) => s.replace(`{${a}}`, b), L()[k]);
const ja = () => state.lang === 'ja';

/* ---------- localised field readers ---------- */
const co = n => COMPANIES[n] || {sector:'',desc:'',sector_ja:'',desc_ja:'',roles:0};
const coSector = n => (ja() ? co(n).sector_ja : co(n).sector);
const coDesc   = n => (ja() ? co(n).desc_ja   : co(n).desc);
const tagTxt   = x => (ja() ? (TAG_JA[x]  || x) : x);
const typeTxt  = x => (ja() ? (TYPE_JA[x] || x) : x);
const lvlTxt   = x => (ja() ? (LVL_JA[x]  || x) : x);
const senTxt   = x => (ja() ? (SEN_JA[x]  || x) : x);
const locTxt   = x => (ja() ? (LOC_JA[x]  || x) : x);

function payTxt(r){
  if (!ja()) return r.salary;
  if (r.salary_max === null && r.salary_min === null) return L().ask;
  const man = n => `${Math.round(n*100)}万円`;
  const plus = r.salary.endsWith('+') ? '以上' : '';
  if (r.salary_min === null) return `〜${man(r.salary_max)}` + plus;
  if (r.salary_min === r.salary_max) return man(r.salary_max) + plus;
  return `${Math.round(r.salary_min*100)}万〜${man(r.salary_max)}` + plus;
}
function remoteTxt(r){
  if (!ja()) return r.remote;
  if (r.remote === 'Fully remote') return 'フルリモート';
  if (r.remote === 'Remote friendly') return 'リモート可';
  if (r.remote === 'Ask') return '要確認';
  const d = parseInt(r.remote);
  return isNaN(d) ? r.remote : `週${d}日リモート`;
}
function remoteDays(r){
  if (r.remote === 'Fully remote') return 5;
  if (r.remote === 'Remote friendly') return 3;
  const d = parseInt(r.remote); return isNaN(d) ? -1 : d;
}
function langPill(r){
  if (r.jp === 'Conversational' || r.jp === 'Either')
    return {t: ja() ? '英語メインで可' : 'English OK', c:'p-green'};
  if (r.jp === 'Business') return {t: ja() ? '日本語ビジネス' : 'Business Japanese', c:'p-green'};
  if (r.jp === 'Fluent')   return {t: ja() ? '日本語流暢'     : 'Fluent Japanese',  c:'p-amber'};
  return {t: ja() ? '日本語ネイティブ' : 'Native Japanese', c:'p-amber'};
}
function remotePill(r){
  const d = remoteDays(r);
  return d < 0 ? null : {t: remoteTxt(r), c: d >= 3 ? 'p-purple' : 'p-grey'};
}

/* ---------- filtering ---------- */
function visible(){
  const q = state.q.toLowerCase().trim();
  return ROLES.filter(r => {
    const hay = (r.title+' '+r.company+' '+r.tags.join(' ')+' '+r.tags.map(tagTxt).join(' ')
      +' '+r.location+' '+(coSector(r.company)||'')).toLowerCase();
    if (q && !hay.includes(q)) return false;
    if (state.tags.size && ![...state.tags].every(x => r.tags.includes(x))) return false;
    if (state.types.size && !state.types.has(r.employer_type)) return false;
    if (state.jp && r.jp !== state.jp) return false;
    if (state.pay && !(r.salary_max >= state.pay)) return false;
    if (state.rem === 'full' && r.remote !== 'Fully remote') return false;
    if (state.rem === 'remote' && remoteDays(r) < 3) return false;
    return true;
  });
}
const activeCount = () => state.tags.size + state.types.size
  + (state.q?1:0) + (state.jp?1:0) + (state.pay?1:0) + (state.rem?1:0);

/* ---------- cards ---------- */
function pills(r){
  const out = [langPill(r)];
  const rp = remotePill(r); if (rp) out.push(rp);
  r.tags.slice(0,2).forEach(x => out.push({t: tagTxt(x), c:'p-grey'}));
  return out.map(p => `<span class="pill ${p.c}">${esc(p.t)}</span>`).join('');
}
function roleCard(r, i){
  return `<div class="card" role="button" tabindex="0" data-role="${i}">
    <div class="cname">${esc(r.company)}</div>
    <div class="csector">${esc(coSector(r.company) || typeTxt(r.employer_type))}</div>
    <div class="role">${esc(r.title)}</div>
    <div class="pay">${esc(payTxt(r))}</div>
    <div class="pins">${pills(r)}</div>
    <div class="cardfoot">
      <span class="loc">📍 ${esc(locTxt(r.location))}</span>
      ${r.link ? `<a class="jd" href="${esc(r.link)}" target="_blank" rel="noopener"
        title="${esc(t('posting'))}">📄 ${esc(t('jd'))} ↗</a>` : ''}
    </div></div>`;
}
function companyCard(name, rs){
  const pays = rs.map(r=>r.salary_max).filter(Boolean);
  const range = pays.length
    ? (ja() ? `${Math.round(Math.min(...pays)*100)}万〜${Math.round(Math.max(...pays)*100)}万円`
            : `¥${Math.min(...pays)}M to ¥${Math.max(...pays)}M`)
    : L().ask;
  const set = [...new Set(rs.flatMap(r=>r.tags))].slice(0,3);
  const d = coDesc(name);
  return `<div class="card" role="button" tabindex="0" data-co="${esc(name)}">
    <div class="cname">${esc(name)}</div>
    <div class="csector">${esc(coSector(name) || typeTxt(rs[0].employer_type))}</div>
    ${d ? `<div class="desc">${esc(d)}</div>` : ''}
    <div class="pins">${set.map(x=>`<span class="pill p-grey">${esc(tagTxt(x))}</span>`).join('')}</div>
    <div class="foot"><span class="n">${rs.length}${ja()?'':' '}${rs.length>1?t('openRolesN'):t('openRole')}</span>
      <span style="color:var(--green);font-weight:bold">${esc(range)}</span></div></div>`;
}
const emptyBlock = () => `<div class="empty"><b>${esc(t('emptyTitle'))}</b>${esc(t('emptyBody'))}</div>`;

function list(){
  const v = visible();
  if (state.view === 'role'){
    $('#n').textContent = v.length; $('#nLabel').textContent = t('rolesShown');
    $('#main').innerHTML = `<div class="grid">${
      v.length ? v.map(r => roleCard(r, ROLES.indexOf(r))).join('') : emptyBlock()}</div>`;
  } else {
    const byCo = {};
    v.forEach(r => (byCo[r.company] = byCo[r.company] || []).push(r));
    const rank = {};
    v.forEach(r => { if (!(r.company in rank)) rank[r.company] = ROLES.indexOf(r); });
    const names = Object.keys(byCo).sort((a,b) => rank[a] - rank[b]);
    $('#n').textContent = names.length; $('#nLabel').textContent = t('companiesShown');
    $('#main').innerHTML = `<div class="grid">${
      names.length ? names.map(n => companyCard(n, byCo[n])).join('') : emptyBlock()}</div>`;
  }
}

/* ---------- detail ---------- */
function aboutPanel(name){
  const d = coDesc(name);
  return d ? `<div class="panel"><div class="plabel"><span class="ico">🏢</span>${esc(t('about',{co:name}))}</div>
    <p>${esc(d)}</p></div>` : '';
}
function roleDetail(i){
  const r = ROLES[i];
  const sibs = ROLES.map((x,ix)=>({x,ix})).filter(o => o.x.company === r.company && o.ix !== i);
  const tabs = [t('overview'), t('requirements')]
    .concat(sibs.length ? [t('moreAt',{n:sibs.length, co:r.company})] : []);
  const tb = Math.min(state.tab, tabs.length-1);
  let panel = '';
  if (tb === 0){
    panel = `<div class="grid2">
      <div class="panel"><div class="plabel"><span class="ico">📍</span>${esc(t('locWork'))}</div>
        <div class="line"><span class="ico">📍</span><span>${esc(locTxt(r.location))}</span></div>
        <div class="line"><span class="ico">🏠</span><span>${esc(remoteTxt(r))}</span></div></div>
      <div class="panel"><div class="plabel"><span class="ico">🌐</span>${esc(t('language'))}</div>
        <div class="line"><span class="ico">🇯🇵</span><span>${esc(t('japanese'))}: ${esc(lvlTxt(r.jp))}</span></div>
        <div class="line"><span class="ico">🇬🇧</span><span>${esc(t('english'))}: ${esc(lvlTxt(r.en))}</span></div></div></div>
      <div class="panel"><div class="plabel"><span class="ico">💰</span>${esc(t('package'))}</div>
        <div class="kv"><span>${esc(t('annual'))}</span><b>${esc(payTxt(r))}</b></div>
        <div class="kv"><span>${esc(t('coType'))}</span><b>${esc(typeTxt(r.employer_type))}</b></div>
        <div class="kv"><span>${esc(t('level'))}</span><b>${esc(senTxt(r.seniority))}</b></div></div>
      ${aboutPanel(r.company)}
      <div class="panel"><div class="plabel"><span class="ico">✅</span>${esc(t('working'))}</div>
        <ul><li>${esc(t('w1'))}</li><li>${esc(t('w2'))}</li><li>${esc(t('w3'))}</li><li>${esc(t('w4'))}</li></ul></div>`;
  } else if (tb === 1){
    panel = `<div class="panel"><div class="plabel"><span class="ico">🎯</span>${esc(t('focusAreas'))}</div>
      <div class="pins">${r.tags.map(x=>`<span class="pill p-grey">${esc(tagTxt(x))}</span>`).join('')}</div></div>
      <div class="panel"><div class="plabel"><span class="ico">🌐</span>${esc(t('langReq'))}</div>
        <div class="kv"><span>${esc(t('japanese'))}</span><b>${esc(lvlTxt(r.jp))}</b></div>
        <div class="kv"><span>${esc(t('english'))}</span><b>${esc(lvlTxt(r.en))}</b></div></div>
      <div class="panel"><div class="plabel"><span class="ico">📄</span>${esc(t('fullDesc'))}</div>
        <p>${esc(t('askFull',{name:CONTACT.name}))}</p></div>`;
  } else {
    panel = sibs.map(o => `<button class="more" type="button" data-role="${o.ix}">
      <span><b>${esc(o.x.title)}</b><small>${esc(tagTxt(o.x.tags[0]||''))} · ${esc(payTxt(o.x))}</small></span>
      <span style="color:var(--red);font-weight:bold">${esc(t('view'))}</span></button>`).join('');
  }
  const mail = `mailto:${CONTACT.email}?subject=${encodeURIComponent('Interested: '+r.title+' at '+r.company)}`;
  $('#main').innerHTML = `<button class="back" type="button" data-back="1">← ${esc(t('back'))}</button>
    <div class="dhead"><div class="deyebrow">${esc(r.company)} · ${esc(coSector(r.company) || typeTxt(r.employer_type))}</div>
      <h2>${esc(r.title)}</h2><div class="dpay">${esc(payTxt(r))}</div>
      <div class="pins" style="margin-top:10px">${pills(r)}</div></div>
    <div class="tabs" role="tablist">${tabs.map((x,ix)=>
      `<button class="tab" role="tab" type="button" aria-selected="${ix===tb}" data-t="${ix}">${esc(x)}</button>`).join('')}</div>
    ${panel}
    <div class="actions"><a class="btn primary" href="${mail}">${esc(t('interest'))}</a>
    ${r.link ? `<a class="btn ghost" href="${esc(r.link)}" target="_blank" rel="noopener">${esc(t('posting'))}</a>` : ''}</div>`;
}
function companyDetail(name){
  const rs = ROLES.map((x,ix)=>({x,ix})).filter(o => o.x.company === name);
  const d = coDesc(name);
  const mail = `mailto:${CONTACT.email}?subject=${encodeURIComponent('Interested in roles at '+name)}`;
  $('#main').innerHTML = `<button class="back" type="button" data-back="1">← ${esc(t('back'))}</button>
    <div class="dhead"><div class="deyebrow">${esc(coSector(name) || typeTxt(rs[0].x.employer_type))}</div>
      <h2>${esc(name)}</h2>
      <div class="csector">${rs.length}${ja()?'':' '}${rs.length>1?t('openRolesN'):t('openRole')}</div></div>
    ${d ? `<div class="panel"><div class="plabel"><span class="ico">🏢</span>${esc(t('about',{co:name}))}</div>
      <p>${esc(d)}</p></div>` : ''}
    <div class="panel"><div class="plabel"><span class="ico">💼</span>${esc(t('openRoles'))}</div>
      ${rs.map(o => `<button class="more" type="button" data-role="${o.ix}">
        <span><b>${esc(o.x.title)}</b><small>${esc(payTxt(o.x))} · ${esc(locTxt(o.x.location))} · ${esc(remoteTxt(o.x))}</small></span>
        <span style="color:var(--red);font-weight:bold">${esc(t('view'))}</span></button>`).join('')}</div>
    <div class="actions"><a class="btn primary" href="${mail}">${esc(t('askAbout',{co:name}))}</a></div>`;
}

/* ---------- chrome ---------- */
function paintChrome(){
  document.documentElement.lang = state.lang;
  $('#h1').textContent = t('title');
  $('#sub').textContent = `${t('curatedBy')} ${CONTACT.name} · ${CONTACT.title} · Robert Half Japan`;
  $('#lblCo').textContent = t('companies'); $('#lblRo').textContent = t('roles');
  $('#lblUp').textContent = t('updated');   $('#sUp').textContent = CONTACT.updated;
  $('#sRo').textContent = ROLES.length;     $('#sCo').textContent = Object.keys(COMPANIES).length;
  $('#tRole').textContent = t('byRole');    $('#tCo').textContent = t('byCompany');
  $('#foldText').textContent = t('filters');
  $('#q').placeholder = t('search');
  $('#rlType').textContent = t('labelType'); $('#rlFocus').textContent = t('labelFocus');
  $('#clear').textContent = t('clear');      $('#foot').textContent = t('foot');

  $('#fJp').innerHTML = `<option value="">${esc(t('anyJp'))}</option>` +
    ['Native','Fluent','Business','Conversational']
      .map(v=>`<option value="${v}"${state.jp===v?' selected':''}>${esc(lvlTxt(v))}</option>`).join('');
  $('#fPay').innerHTML = `<option value="0">${esc(t('anyPay'))}</option>` +
    [10,13,15,20,25].map(v=>`<option value="${v}"${state.pay===v?' selected':''}>${esc(t('payAbove',{n:v}))}</option>`).join('');
  $('#fRem').innerHTML = `<option value="">${esc(t('anyWork'))}</option>` +
    `<option value="remote"${state.rem==='remote'?' selected':''}>${esc(t('remote3'))}</option>` +
    `<option value="full"${state.rem==='full'?' selected':''}>${esc(t('fullRemote'))}</option>`;

  const allTags = [...new Set(ROLES.flatMap(r=>r.tags))]
    .sort((a,b)=>ROLES.filter(r=>r.tags.includes(b)).length - ROLES.filter(r=>r.tags.includes(a)).length);
  $('#chips').innerHTML = allTags.map(x =>
    `<button class="chip" type="button" aria-pressed="${state.tags.has(x)}" data-tag="${esc(x)}">${esc(tagTxt(x))}</button>`).join('');
  $('#chipsType').innerHTML = ['Internal','Consulting','Vendor','Technology']
    .filter(x => ROLES.some(r=>r.employer_type===x)).map(x =>
    `<button class="chip" type="button" aria-pressed="${state.types.has(x)}" data-type="${esc(x)}">${esc(typeTxt(x))}
     <small>${ROLES.filter(r=>r.employer_type===x).length}</small></button>`).join('');
}
function paintFold(){
  const c = activeCount(), b = $('#fbody');
  $('#controls').classList.toggle('folded', state.folded);
  $('#fold').classList.toggle('active', c > 0);
  $('#foldBadge').textContent = c;
  $('#fold').setAttribute('aria-expanded', !state.folded);
  // Panel height depends on how many chip rows wrap, which depends on screen
  // width and language. Measure it rather than assuming a fixed ceiling.
  b.style.maxHeight = state.folded ? '0px' : b.scrollHeight + 'px';
}
let rz;
window.addEventListener('resize', () => {
  clearTimeout(rz);
  rz = setTimeout(paintFold, 120);
});
function render(){
  if (state.openRole !== null) roleDetail(state.openRole);
  else if (state.openCo) companyDetail(state.openCo);
  else list();
  paintFold();
}
const reset = () => { state.openRole = null; state.openCo = null; state.tab = 0; };
const toTop = () => window.scrollTo({top:0, behavior:'smooth'});

/* ---------- events ---------- */
$('#main').addEventListener('click', e => {
  if (e.target.closest('a')) return;              // JD link opens normally
  if (e.target.closest('[data-back]')){ reset(); render(); return toTop(); }
  const role = e.target.closest('[data-role]');
  if (role){ state.openRole = +role.dataset.role; state.openCo = null; state.tab = 0; render(); return toTop(); }
  const c = e.target.closest('[data-co]');
  if (c){ state.openCo = c.dataset.co; state.openRole = null; render(); return toTop(); }
  const tb = e.target.closest('.tab');
  if (tb){ state.tab = +tb.dataset.t; render(); }
});
$('#main').addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const card = e.target.closest('[role="button"]');
  if (!card) return;
  e.preventDefault(); card.click();
});
$('#fold').addEventListener('click', () => { state.folded = !state.folded; paintFold(); });
$('#vRole').addEventListener('click', () => setView('role'));
$('#vCo').addEventListener('click', () => setView('company'));
function setView(v){
  state.view = v; reset();
  $('#vRole').setAttribute('aria-pressed', v==='role');
  $('#vCo').setAttribute('aria-pressed', v==='company');
  render();
}
$('#lEn').addEventListener('click', () => setLang('en'));
$('#lJa').addEventListener('click', () => setLang('ja'));
function setLang(v){
  state.lang = v;
  $('#lEn').setAttribute('aria-pressed', v==='en');
  $('#lJa').setAttribute('aria-pressed', v==='ja');
  paintChrome(); render();
}
$('#chips').addEventListener('click', e => {
  const c = e.target.closest('.chip'); if (!c) return;
  const x = c.dataset.tag;
  state.tags.has(x) ? state.tags.delete(x) : state.tags.add(x);
  c.setAttribute('aria-pressed', state.tags.has(x)); reset(); render();
});
$('#chipsType').addEventListener('click', e => {
  const c = e.target.closest('.chip'); if (!c) return;
  const x = c.dataset.type;
  state.types.has(x) ? state.types.delete(x) : state.types.add(x);
  c.setAttribute('aria-pressed', state.types.has(x)); reset(); render();
});
$('#q').addEventListener('input', e => { state.q = e.target.value; reset(); render(); });
$('#fJp').addEventListener('change', e => { state.jp = e.target.value; reset(); render(); });
$('#fPay').addEventListener('change', e => { state.pay = +e.target.value; reset(); render(); });
$('#fRem').addEventListener('change', e => { state.rem = e.target.value; reset(); render(); });
$('#clear').addEventListener('click', () => {
  Object.assign(state, {q:"", jp:"", pay:0, rem:""});
  state.tags.clear(); state.types.clear(); reset();
  $('#q').value = ""; paintChrome(); render();
});

paintChrome();
render();
</script>
</body>
</html>
