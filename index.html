<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open Cyber Security Roles, Tokyo | Robert Half Japan</title>
<meta name="description" content="Curated cyber security roles in Tokyo. Salary, remote days, office location and language level for every role.">
<style>
:root{
  --red:#CC0033; --red-dark:#A3002A;
  --ink:#1B242C; --ink-soft:#3C4852; --muted:#6B7780;
  --paper:#F7F6F3; --white:#fff; --line:#E7E4DF;
  --green:#0B6B4F; --green-bg:#E6F4EE;
  --purple:#59379E; --purple-bg:#F1ECFB;
  --amber:#8F5510; --amber-bg:#FBF0E2;
  --font:Arial,"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);background:var(--paper);color:var(--ink);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--red);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px}

header{background:#27323A;color:#fff;padding:30px 0 26px;border-bottom:5px solid var(--red)}
.headtop{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.brandline{display:flex;align-items:center;gap:10px;margin-bottom:15px}
.brandmark{width:24px;height:24px;background:var(--red);border-radius:26%;flex:none}
.brandtext{font-size:11px;letter-spacing:.15em;text-transform:uppercase;font-weight:bold;color:#E1DDD7}
h1{margin:0 0 6px;font-size:31px;line-height:1.15;letter-spacing:-.025em;color:#fff}
.sub{margin:0;color:#AEB9C0;font-size:13.5px}
.stats{display:flex;gap:36px;margin-top:22px}
.stat b{display:block;font-size:27px;line-height:1.1;letter-spacing:-.02em;color:#fff}
.stat span{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:#8E9BA3}
.langsw{display:inline-flex;background:rgba(255,255,255,.09);border-radius:9px;padding:3px;flex:none}
.langsw button{border:none;background:none;padding:6px 13px;border-radius:7px;
  font-size:12.5px;color:#C4CDD3;transition:.12s}
.langsw button[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:bold}

.controls{position:sticky;top:0;z-index:20;background:var(--paper);
  border-bottom:1px solid var(--line);padding:13px 0}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--white);border:1px solid var(--line);
  border-radius:11px;padding:3px}
.seg button{border:none;background:none;padding:8px 16px;border-radius:8px;font-size:13.5px;
  color:var(--muted);transition:.12s;display:inline-flex;align-items:center;gap:7px}
.seg button .ico{font-size:14px;filter:grayscale(1);opacity:.65}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;font-weight:bold}
.seg button[aria-pressed="true"] .ico{filter:none;opacity:1}
.rightgrp{display:flex;align-items:center;gap:12px}
.count{font-size:13px;color:var(--muted)}
.count b{color:var(--ink)}
.collapse{display:inline-flex;align-items:center;gap:7px;background:var(--white);
  border:1px solid var(--line);border-radius:10px;padding:8px 13px;font-size:13px}
.collapse:hover{border-color:#CDC7BE}
.collapse .badge{background:var(--red);color:#fff;border-radius:999px;font-size:10.5px;
  font-weight:bold;padding:1px 7px;display:none}
.collapse.active .badge{display:inline-block}
.collapse .arrow{transition:transform .18s;font-size:10px;color:var(--muted)}
.controls.folded .collapse .arrow{transform:rotate(-90deg)}

.body{overflow:hidden;margin-top:12px;
  transition:max-height .22s ease,opacity .16s,margin-top .22s}
.controls.folded .body{max-height:0!important;opacity:0;margin-top:0}
.filterline{display:flex;gap:9px;flex-wrap:wrap}
.search{flex:1 1 260px}
.search input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;
  background:var(--white);font-size:15px;color:var(--ink)}
select{padding:11px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--white);color:var(--ink);font-size:13.5px}
.chiprow{display:flex;align-items:center;gap:12px;margin-top:11px}
.rowlabel{flex:none;width:100px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  font-weight:bold;color:var(--muted)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0;scrollbar-width:thin}
.chip{white-space:nowrap;padding:6px 13px;border:1px solid var(--line);background:var(--white);
  border-radius:999px;color:var(--muted);font-size:12.5px;transition:.12s}
.chip small{opacity:.6;margin-left:5px;font-size:11px}
.chip:hover{border-color:#CDC7BE}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff;font-weight:bold}
.chip[aria-pressed="true"] small{opacity:.8}
#chipsType .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.chip.quick.newchip{border-color:var(--red);color:var(--red)}
.chip.quick.newchip:hover{background:#FBE9EE}
.chip.quick.newchip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.chip.quick{border-color:var(--green);color:var(--green);font-weight:bold}
.chip.quick:hover{background:var(--green-bg)}
.chip.quick[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.clearrow{text-align:right;margin-top:9px}
.clear{background:none;border:none;color:var(--red);font-size:12.5px;padding:0}

main{padding:22px 0 70px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:11px}
.card{text-align:left;width:100%;background:var(--white);border:1px solid var(--line);
  border-radius:13px;padding:16px 17px;transition:.13s;display:flex;flex-direction:column;
  position:relative}
.newbadge{position:absolute;top:12px;right:13px;background:var(--red);color:#fff;
  font-size:10px;font-weight:bold;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 8px;border-radius:5px;line-height:1.4}
.newbadge.inline{position:static;margin-left:9px;vertical-align:middle}
.cname{padding-right:46px}
.card:hover{border-color:var(--red);box-shadow:0 5px 16px rgba(27,36,44,.08);transform:translateY(-1px)}
.cname{font-size:16px;font-weight:bold;letter-spacing:-.01em;line-height:1.25}
.csector{font-size:11.5px;color:var(--muted);margin-top:2px}
.role{font-size:14.5px;color:var(--ink-soft);margin-top:8px;line-height:1.4}
.pay{color:var(--green);font-weight:bold;font-size:14px;margin-top:7px}
.desc{font-size:13px;color:var(--muted);margin-top:9px;line-height:1.5}
.pins{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px}
.pill{font-size:11px;border-radius:6px;padding:3px 8px;font-weight:bold;white-space:nowrap}
.p-green{background:var(--green-bg);color:var(--green)}
.p-purple{background:var(--purple-bg);color:var(--purple)}
.p-amber{background:var(--amber-bg);color:var(--amber)}
.p-grey{background:#F0EFEC;color:var(--muted)}
.loc{font-size:12.5px;color:var(--muted)}
.cardfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;
  margin-top:10px;flex-wrap:wrap}
.jd{font-size:12px;font-weight:bold;color:var(--red);white-space:nowrap}
.jd:hover{text-decoration:underline}
.card{cursor:pointer}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;
  padding-top:11px;border-top:1px solid var(--line);font-size:12.5px}
.foot .n{color:var(--red);font-weight:bold}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}

.back{background:var(--white);border:1px solid var(--line);border-radius:999px;
  padding:8px 16px;font-size:13px;margin-bottom:20px}
.dhead h2{margin:4px 0 7px;font-size:27px;letter-spacing:-.025em;line-height:1.18}
.deyebrow{font-size:13px;font-weight:bold}
.dpay{color:var(--green);font-weight:bold;font-size:18px}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin:22px 0;overflow-x:auto}
.tab{background:none;border:none;padding:10px 0;color:var(--muted);font-size:14px;
  border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);font-weight:bold;border-bottom-color:var(--red)}
.panel{background:var(--white);border:1px solid var(--line);border-radius:13px;
  padding:16px 18px;margin-bottom:11px}
.plabel{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  font-weight:bold;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.plabel .ico{font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.line{display:flex;align-items:flex-start;gap:8px;padding:5px 0;font-size:14px}
.line .ico{flex:none;width:17px;text-align:center}
.kv{display:flex;justify-content:space-between;gap:14px;padding:7px 0;
  border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:none}
.kv span{color:var(--muted)}
.kv b{text-align:right}
.panel p{margin:0;color:var(--ink-soft);font-size:14px}
.panel ul{margin:0;padding-left:19px;color:var(--ink-soft)}
.panel li{margin-bottom:5px}
.more{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;
  background:var(--white);border:1px solid var(--line);border-radius:11px;
  padding:13px 15px;margin-bottom:8px;text-align:left}
.more:hover{border-color:var(--red)}
.more small{color:var(--muted);display:block;font-size:12px;font-weight:normal}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0 8px}
.btn{padding:12px 20px;border-radius:10px;font-size:14px;font-weight:bold;
  border:1px solid var(--ink);display:inline-block}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:var(--red-dark);text-decoration:none}
.btn.ghost{background:var(--white)}
.btn.ghost:hover{text-decoration:none;border-color:var(--red);color:var(--red)}

/* ---------- CV match ---------- */
.mwrap{max-width:720px;margin:26px auto 70px}
.mintro{text-align:center;margin-bottom:22px}
.mintro h2{margin:0 0 7px;font-size:25px;letter-spacing:-.025em}
.mintro p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
.mcard{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:12px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:30px 20px;text-align:center;
  cursor:pointer;transition:.14s;background:var(--paper)}
.drop:hover,.drop.over{border-color:var(--red);background:#FDF5F7}
.drop .big{font-size:30px;line-height:1}
.drop .t{font-weight:bold;margin-top:9px;font-size:15px}
.drop .h{color:var(--muted);font-size:12.5px;margin-top:4px}
.fileok{display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--green-bg);border:1px solid #BFE3D4;border-radius:10px;padding:12px 14px;font-size:14px}
.fileok b{color:var(--green)}
.linkbtn{background:none;border:none;color:var(--red);font-size:12.5px;padding:0;text-decoration:underline}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.field{display:block}
.field label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);font-weight:bold;margin-bottom:6px}
.field select,.field input{width:100%;padding:11px 12px;border:1px solid var(--line);
  border-radius:10px;background:var(--white);font-size:14px;color:var(--ink)}
.hint{font-size:12px;color:var(--muted);margin-top:5px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.privacy{font-size:12px;color:var(--muted);background:var(--paper);border:1px solid var(--line);
  border-radius:10px;padding:12px 14px;margin-top:14px;line-height:1.6}
.scorehead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  margin:24px 0 12px;flex-wrap:wrap}
.scorehead h3{margin:0;font-size:19px;letter-spacing:-.02em}
.mrow{background:var(--white);border:1px solid var(--line);border-radius:13px;padding:15px 16px;
  margin-bottom:9px;display:flex;gap:14px;align-items:flex-start;cursor:pointer;transition:.13s;
  text-align:left;width:100%}
.mrow:hover{border-color:var(--red);box-shadow:0 4px 13px rgba(27,36,44,.07)}
.ring{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;
  font-weight:bold;font-size:14px;color:#fff;background:var(--muted)}
.ring.hi{background:var(--green)} .ring.mid{background:#B5820E} .ring.lo{background:#8C969D}
.mbody{flex:1;min-width:0}
.mtitle{font-weight:bold;font-size:15px;line-height:1.3}
.mco{font-size:12.5px;color:var(--muted);margin-top:2px}
.why{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.why span{font-size:11px;border-radius:5px;padding:3px 8px;background:var(--green-bg);color:var(--green);font-weight:bold}
.why span.miss{background:#FBF0E2;color:var(--amber)}
.why span.conf{background:#EDEFF1;color:var(--muted)}
.warnbox{background:#FBF0E2;border:1px solid #EBD6B0;color:var(--amber);border-radius:11px;
  padding:13px 15px;font-size:13px;margin-bottom:12px;line-height:1.55}
.basis{font-size:12px;color:var(--muted);margin:14px 0 0;line-height:1.6}
@media(max-width:700px){.frow{grid-template-columns:1fr}.mwrap{margin-top:16px}}
/* ---------- brand + CTA ---------- */
.brandline{display:inline-flex;align-items:center;gap:10px;margin-bottom:15px;text-decoration:none}
.brandline:hover{text-decoration:none;opacity:.85}
.rhlogo{height:26px;width:auto;display:block}
.headright{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.cta{display:inline-flex;align-items:center;gap:7px;background:var(--red);color:#fff;
  font-size:13.5px;font-weight:bold;padding:10px 16px;border-radius:10px;white-space:nowrap}
.cta:hover{background:var(--red-dark);text-decoration:none;color:#fff}
.cta.big{font-size:15px;padding:14px 26px}
.cta::before{content:"\1F4C5"}

/* ---------- footer ---------- */
footer{background:#27323A;color:#C4CDD3;border-top:none;padding:36px 0 34px;font-size:13px}
.fgrid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:26px}
.fbrand .rhlogo{height:24px;margin-bottom:14px}
.fname{margin:0 0 12px;color:#fff;font-size:13.5px;line-height:1.55;white-space:pre-line}
.faddr{margin:0;color:#8E9BA3;font-size:12.5px;line-height:1.7;white-space:pre-line}
.fcol h4{margin:0 0 12px;font-size:12.5px;color:#fff;letter-spacing:.02em}
.fcol a{display:block;color:#C4CDD3;margin-bottom:9px;font-size:13px}
.fcol a:hover{color:#fff;text-decoration:underline}
.langsw.dark{background:rgba(255,255,255,.09)}
.langsw.dark button{color:#C4CDD3}
.langsw.dark button[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:bold}
.fcta{margin-top:30px;padding-top:26px;border-top:1px solid rgba(255,255,255,.12);text-align:center}
.fnote{margin:22px 0 0;color:#78858D;font-size:11.5px;line-height:1.7;text-align:center;
  max-width:760px;margin-left:auto;margin-right:auto}
@media(max-width:780px){
  .fgrid{grid-template-columns:1fr 1fr;gap:22px}
  .fbrand{grid-column:1/-1}
}
@media(max-width:520px){
  .fgrid{grid-template-columns:1fr}
  .headright{width:100%;justify-content:flex-start;margin-top:12px}
  .cta.big{width:100%;justify-content:center}
}
@media(max-width:700px){
  .wrap{padding:0 15px}
  h1{font-size:22px} .dhead h2{font-size:20px} .grid2{grid-template-columns:1fr}
  .stats{gap:20px} .stat b{font-size:21px} .stat span{font-size:9.5px}
  header{padding:22px 0 20px}
  .controls{padding:10px 0}
  .grid{grid-template-columns:1fr;gap:9px}
  .seg button{padding:8px 12px;font-size:13px}
  .collapse{padding:9px 14px}
  .filterline{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .search{grid-column:1/-1}
  select{width:100%;padding:10px}
  .chiprow{display:block;margin-top:10px}
  .rowlabel{width:auto;margin-bottom:6px}
  .chips{margin:0 -15px;padding:2px 15px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header><div class="wrap">
  <div class="headtop">
    <div>
      <a class="brandline" href="https://www.roberthalf.jp" target="_blank" rel="noopener">
        <img src="logo.png" alt="Robert Half" class="rhlogo"
             onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'brandtext',textContent:'ROBERT HALF'}))">
      </a>
      <h1 id="h1"></h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="headright">

</div></header>

<div class="controls" id="controls"><div class="wrap">

      <button type="button" id="vRole" aria-pressed="true"><span class="ico">💼</span><span id="tRole"></span></button>

    <div class="chiprow"><div class="rowlabel" id="rlQuick"></div>
      <div class="chips">
        <button class="chip quick newchip" type="button" id="newOnly" aria-pressed="false">
          <span id="newOnlyTxt"></span> <small id="newOnlyN"></small></button>
        <button class="chip quick" type="button" id="engOk" aria-pressed="false">
          <span id="engOkTxt"></span> <small id="engOkN"></small></button></div></div>

</div></div>

<main class="wrap" id="main"></main>
<div class="wrap" id="matchPane" hidden></div>
<footer><div class="wrap">
  <div class="fgrid">
    <div class="fbrand">
      <img src="logo.png" alt="Robert Half" class="rhlogo"
           onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'brandtext',textContent:'ROBERT HALF'}))">
      <p class="fname" id="fName"></p>
      <p class="faddr" id="fAddr"></p>
    </div>
    <div class="fcol"><h4 id="fcContact"></h4>
      <a id="fEmail" href="#"></a>
      <a id="fBook" href="#" target="_blank" rel="noopener"></a></div>
    <div class="fcol"><h4 id="fcRes"></h4>
      <a id="fRoles" href="#"></a>
      <a id="fLinked" href="#" target="_blank" rel="noopener"></a></div>
    <div class="fcol"><h4 id="fcLang"></h4>
      <div class="langsw dark" role="group">
        <button type="button" id="lEn2">EN</button>
        <button type="button" id="lJa2">日本語</button></div></div>
  </div>
  <div class="fcta"><a class="cta big" id="ctaFoot" href="#" target="_blank" rel="noopener"></a></div>

<script>
const CONTACT = {
  name: "Steven Li",
  title: "Director APAC",
  email: "steven.li@roberthalf.jp",
  calendly: "https://calendly.com/cybersteve/30mins",
  linkedin: "https://www.linkedin.com/in/cybersteve/",
  addr: ["TOKYO TORCH Tokiwabashi Tower 24F", "2-6-4 Otemachi, Chiyoda-ku", "Tokyo 100-0004"],

/* ================= CV MATCH =================
   Everything here runs in the visitor's browser. The CV is never uploaded:
   it is read with FileReader, scored against ROLES in memory, and discarded
   when the tab is closed. Nothing reaches a server unless the visitor
   presses Send, which opens their own email client.
============================================= */
const M = {file:null, text:'', pay:'', jp:'', en:'', results:null, busy:false, note:''};
const LEVELS = ['Native','Fluent','Business','Conversational','None'];
const LVKEY = {Native:'lvNative', Fluent:'lvFluent', Business:'lvBusiness',
               Conversational:'lvConv', None:'lvNone'};
const JPRANK = {Native:5, Fluent:4, Business:3, Conversational:2, 'Not required':0,
                Either:1, Ask:2, 'Not specified':2, None:0};

/* --- read the CV in the browser --- */
async function readCV(file){
  M.busy = true; M.note = ''; renderMatch();
  try {
    if (/\.txt$/i.test(file.name))        M.text = await file.text();
    else if (/\.pdf$/i.test(file.name))   M.text = await pdfText(file);
    else if (/\.docx?$/i.test(file.name)) M.text = await docxText(file);
    else                                  M.text = await file.text();
  } catch (e) { M.text = ''; }
  M.text = (M.text || '').replace(/\s+/g, ' ').trim();
  if (M.text.length < 80){ M.text = ''; M.note = t('mNoText'); }
  M.busy = false; renderMatch();
}
// Pull readable strings out of a PDF without a library. Works on uncompressed
// text runs; encrypted or fully compressed PDFs fall back to the note above.
async function pdfText(file){
  const b = new Uint8Array(await file.arrayBuffer());
  let raw = ''; for (let i = 0; i < b.length; i++) raw += String.fromCharCode(b[i]);
  let out = [];
  (raw.match(/\((?:\\.|[^\\()])*\)/g) || []).forEach(m => {
    const v = m.slice(1,-1).replace(/\\([()\\])/g,'$1');
    if (/[A-Za-z]{2}/.test(v)) out.push(v);
  });
  return out.join(' ');
}
// .docx is a zip; document.xml holds the text. Read it with DecompressionStream
// where available, which covers current Chrome, Edge, Safari and Firefox.
async function docxText(file){
  const buf = new Uint8Array(await file.arrayBuffer());
  const xml = await unzipEntry(buf, 'word/document.xml');
  if (!xml) return '';
  return xml.replace(/<\/w:p>/g,' ').replace(/<[^>]+>/g,' ');
}
async function unzipEntry(buf, want){
  const dv = new DataView(buf.buffer);
  for (let i = buf.length - 22; i >= 0; i--){
    if (dv.getUint32(i, true) !== 0x06054b50) continue;
    let off = dv.getUint32(i + 16, true), n = dv.getUint16(i + 10, true);
    for (let k = 0; k < n; k++){
      const nl = dv.getUint16(off + 28, true), el = dv.getUint16(off + 30, true),
            cl = dv.getUint16(off + 32, true), lho = dv.getUint32(off + 42, true),
            method = dv.getUint16(off + 10, true), csize = dv.getUint32(off + 20, true);
      const name = new TextDecoder().decode(buf.subarray(off + 46, off + 46 + nl));
      if (name === want){
        const lnl = dv.getUint16(lho + 26, true), lel = dv.getUint16(lho + 28, true);
        const start = lho + 30 + lnl + lel;
        const data = buf.subarray(start, start + csize);
        if (method === 0) return new TextDecoder().decode(data);
        if (typeof DecompressionStream === 'undefined') return '';
        const ds = new DecompressionStream('deflate-raw');
        const stream = new Blob([data]).stream().pipeThrough(ds);
        return await new Response(stream).text();
      }
      off += 46 + nl + el + cl;
    }
    break;
  }
  return '';
}

const STOP = new Set(('a an the and or of for to in on with at by is are was were be been as from '
 +'that this it its their our your my we you they he she i me not no but if then than so such have '
 +'has had do does did will would can could should may might must about into over under more most '
 +'other some any all each both few many much own same very s t don now work experience company '
 +'japan tokyo team role roles years year month japanese english level new skills skill using used '
 +'including include etc via per across within strong good excellent ability able responsible '
 +'responsibilities requirements preferred plus well high low large small global local').split(' '));

/* Inverse document frequency over the role set. A word in most roles carries
   almost no signal: "security" sits in 65% of these roles, so matching it
   tells us nothing. Rare words (sailpoint, iso21434, burp) carry the signal. */
const roleTerms = r => {
  const bag = (r.title + ' ' + r.tags.join(' ') + ' ' + (r.kw || '')).toLowerCase();
  return new Set((bag.match(/[a-z][a-z0-9+#.]{2,}/g) || [])
    .map(w => w.replace(/[.]+$/,''))
    .filter(w => w.length > 2 && !STOP.has(w)));
};
const DF = {};
ROLES.forEach(r => roleTerms(r).forEach(w => DF[w] = (DF[w] || 0) + 1));
const N = ROLES.length;
const idf = w => Math.log(N / (1 + (DF[w] || 0)));          // high = rare = informative
const IDF_FLOOR = Math.log(N / (1 + N * 0.18));             // drop words in >18% of roles

function cvTerms(){
  const out = new Set();
  (M.text.toLowerCase().match(/[a-z][a-z0-9+#.]{2,}/g) || []).forEach(w => {
    w = w.replace(/[.]+$/,'');
    if (w.length > 2 && !STOP.has(w)) out.add(w);
  });
  return out;
}

/* Transferable experience. Rare-word overlap alone cannot tell that an
   auditor's controls background is relevant to a GRC role while a barista's
   is not. These terms are deliberately NOT security words: they are the
   corporate competencies that carry across into a security role. Each maps
   to the role families it genuinely supports. */
const TRANSFER = {
  audit:['GRC & Governance'], auditing:['GRC & Governance'], auditor:['GRC & Governance'],
  controls:['GRC & Governance'], control:['GRC & Governance'], compliance:['GRC & Governance'],
  regulatory:['GRC & Governance'], regulation:['GRC & Governance'], sox:['GRC & Governance'],
  jsox:['GRC & Governance'], risk:['GRC & Governance'], governance:['GRC & Governance'],
  policy:['GRC & Governance'], policies:['GRC & Governance'], framework:['GRC & Governance'],
  privacy:['Privacy'], gdpr:['Privacy'], appi:['Privacy'],
  vendor:['GRC & Governance'], procurement:['GRC & Governance'], contract:['GRC & Governance'],
  project:['Project Management'], programme:['Project Management'], program:['Project Management'],
  pmo:['Project Management'], stakeholder:['Project Management'], budget:['Project Management'],
  presales:['Pre-sales'], sales:['Sales'], account:['Sales'], customer:['Post-sales'],
  consulting:['Consulting'], consultant:['Consulting'], advisory:['Consulting'],
  // general corporate signal: counts a little towards any role
  finance:[], financial:[], banking:[], insurance:[], accounting:[], cpa:[], manufacturing:[],
  enterprise:[], corporate:[], reporting:[], analysis:[], bilingual:[], jlpt:[],
  developer:[], engineering:[], software:[], infrastructure:[], network:[], cloud:[], database:[],
  linux:[], python:[], automation:[], devops:[]
};

/* Coverage: of this role's DISTINCTIVE vocabulary, how much does the CV show
   evidence of? Weighted by idf, so rare overlaps count and generic ones do not. */
function scoreRole(r, terms, payM){
  const rt = [...roleTerms(r)].filter(w => idf(w) >= IDF_FLOOR);
  let total = 0, got = 0; const matched = []; let strong = 0;
  rt.forEach(w => {
    // A word that is also general corporate vocabulary ("risk", "vendor",
    // "review") is weaker proof of security experience than a term only a
    // practitioner would use ("isms", "siem", "burp"), so it counts for less.
    const soft = Object.prototype.hasOwnProperty.call(TRANSFER, w);
    const weight = idf(w) * (soft ? 0.4 : 1);
    total += idf(w);
    if (terms.has(w)){ got += weight; matched.push(w); if (!soft) strong++; }
  });
  // A role with only two distinctive words is easy to "cover" by luck, so
  // damp thin records rather than letting them top the list on one keyword.
  const depth = Math.min(1, rt.length / 5);
  const coverage = total > 0 ? (got / total) * depth : 0;
  const evidence = strong;          // practitioner-level matches only

  // Skill overlap GATES the score. Salary and language only scale a real
  // match up or down: they can never manufacture one. A CV from another
  // field has no overlap, so it scores near zero whatever it earns today.
  // Transferable credit: aligned terms (an auditor applying to GRC) count for
  // more than general corporate terms, and neither can reach a real match.
  let aligned = 0, general = 0; const adjWords = [];
  Object.keys(TRANSFER).forEach(w => {
    if (!terms.has(w)) return;
    const fam = TRANSFER[w];
    if (fam.length && fam.some(f => r.tags.includes(f))){ aligned++; adjWords.push(w); }
    else general++;
  });
  const adj = Math.min(1, aligned / 3) * 20 + Math.min(1, general / 5) * 7;

  let score = coverage * 100 + (coverage > 0 ? adj * 0.35 : adj);
  const why = [], gaps = [];
  if (evidence >= 2) why.push(t('mSkill') + ': ' + matched.slice(0,4).join(', '));
  else if (aligned >= 2) why.push(t('mTransfer') + ': ' + adjWords.slice(0,3).join(', '));

  if (payM && r.salary_max){
    if (r.salary_max >= payM * 1.05){ score *= 1.10; why.push(t('mSalFit')); }
    else if (r.salary_max >= payM * 0.9){ score *= 1.00; }
    else { score *= 0.80; gaps.push(t('mSalUnder')); }
  }

  const need = JPRANK[r.jp] ?? 2, have = JPRANK[M.jp] ?? 0;
  if (have >= need){ score *= 1.05; if (need >= 4) why.push(t('mJpFit')); }
  else { score *= Math.max(0.35, 1 - (need - have) * 0.22); gaps.push(t('mJpOver')); }

  if (r.is_new) score *= 1.02;

  // Confidence is a function of real vocabulary evidence, nothing else.
  let conf = 'high';
  if (!M.text){ conf = 'none'; score = 0; }
  else if (evidence === 0){
    conf = 'low'; gaps.length = 0; gaps.push(t('mNoOverlap'));
    score = Math.min(score, aligned >= 2 ? 24 : 8);
  }
  else if (evidence === 1){
    // One shared word is coincidence, not a match: "audit" appears in an
    // accountant's CV and "retail" in a barista's. Never let it read as a fit.
    conf = 'low'; score = Math.min(score, aligned >= 2 ? 26 : 9);
  }
  else if (evidence === 2){ conf = 'mid'; score = Math.min(score, 55); }
  else if (evidence === 3){ conf = 'mid'; }

  return {r, score: Math.max(0, Math.round(Math.min(96, score))),
          why: why.slice(0,3), gaps: gaps.slice(0,2), evidence, conf, matched};
}

function runMatch(){
  const payM = M.pay ? parseFloat(M.pay) / 1000000 : 0;  // yen -> millions
  const terms = M.text ? cvTerms() : new Map();
  const all = ROLES.map(r => scoreRole(r, terms, payM)).sort((a,b) => b.score - a.score);
  // Only show roles with real vocabulary evidence. A long list of weak guesses
  // is worse than a short honest one.
  const solid = all.filter(m => m.evidence >= 2);
  M.results = (solid.length >= 3 ? solid : all).slice(0, 12);
  M.weak = solid.length < 3;
  renderMatch();
}

/* --- view --- */

    ['dragleave','drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('over'); }));
    dz.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) pickFile(f); });
    fi.addEventListener('change', e => { const f = e.target.files[0]; if (f) pickFile(f); });
  }
  const cl = $('#mClear');
  if (cl) cl.addEventListener('click', () => { M.file=null; M.text=''; M.note=''; renderMatch(); });
  $('#mPay').addEventListener('input', e => M.pay = e.target.value);
  $('#mJp').addEventListener('change', e => M.jp = e.target.value);
  $('#mEn').addEventListener('change', e => M.en = e.target.value);
  $('#mGo').addEventListener('click', () => {
    if (!M.file || !M.pay || !M.jp || !M.en){ alert(t('mNeedAll')); return; }
    runMatch();
  });
}

function pickFile(f){
  if (f.size > 5 * 1024 * 1024){ alert(t('mDropHint')); return; }
  M.file = f; readCV(f);
}

function renderResults(pane){
  const rows = M.results.map(m => {
    const cls = m.score >= 65 ? 'hi' : m.score >= 40 ? 'mid' : 'lo';
    const conf = m.conf === 'none' ? t('mConfNone') : m.conf === 'low' ? t('mConfLow')
               : m.conf === 'mid' ? t('mConfMid') : '';
    const chips = m.why.map(w => `<span>${esc(w)}</span>`)
      .concat(conf ? [`<span class="conf">${esc(conf)}</span>`] : [])
      .concat(m.gaps.map(g => `<span class="miss">${esc(g)}</span>`)).join('');
    return `<button class="mrow" type="button" data-role="${ROLES.indexOf(m.r)}">
      <span class="ring ${cls}">${m.conf === 'none' ? '?' : m.score + '%'}</span>
      <span class="mbody"><span class="mtitle">${esc(m.r.title)}</span>
        <span class="mco">${esc(m.r.company)} · ${esc(payTxt(m.r))} · ${esc(locTxt(m.r.location))}</span>
        <span class="why">${chips}</span></span></button>`;
  }).join('');

  const top = M.results.slice(0,5)
    .map(m => `${m.score}% - ${m.r.title} (${m.r.company})`).join('\n');
  const body = encodeURIComponent(
    `Hello ${CONTACT.name},\n\nI used the matching tool on your cyber security roles page.\n\n`
    + `Current total package: ${M.pay} JPY\nJapanese: ${M.jp}\nEnglish: ${M.en}\n\n`
    + `My top matches:\n${top}\n\n`
    + `My CV is attached.\n\nThank you.`);

  pane.innerHTML = `<div class="mwrap">
    <button class="back" type="button" id="mBack">&larr; ${esc(t('backRoles'))}</button>
    <div class="scorehead"><h3>${esc(t('mResults'))}</h3>
      <span class="count">${esc(t('mOf',{n:M.results.length, total:ROLES.length}))}</span></div>
    ${M.weak ? `<div class="warnbox">${esc(t('mWeak'))}</div>` : ''}
    ${rows}
    <div class="basis">${esc(t('mBasis'))}</div>
    <div class="btnrow">
      <a class="btn primary" href="mailto:${CONTACT.email}?subject=${encodeURIComponent('CV match from the roles page')}&body=${body}">${esc(t('mSend'))}</a>
      <button class="btn ghost" id="mReset" type="button">${esc(t('mAgain'))}</button></div>
    <div class="privacy">${esc(t('mPrivacy'))}</div></div>`;

  $('#mBack').addEventListener('click', () => setView('role'));
  $('#mReset').addEventListener('click', () => {
    M.results = null; M.file = null; M.text = ''; M.note = ''; renderMatch();
  });
  pane.querySelectorAll('[data-role]').forEach(el => el.addEventListener('click', () => {
    state.view = 'role'; setView('role');
    state.openRole = +el.dataset.role; render(); toTop();
  }));
}

/* Headline figures count up once on first paint. Later repaints (a language
   switch) set the number directly, so the page does not re-animate. */
const counted = {};
function countUp(sel, target){
  const el = $(sel);
  if (counted[sel] || window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    el.textContent = target; counted[sel] = true; return;
  }
  counted[sel] = true;
  const dur = 900, t0 = performance.now();
  const ease = x => 1 - Math.pow(1 - x, 3);
  (function step(now){
    const k = Math.min(1, (now - t0) / dur);
    el.textContent = Math.round(ease(k) * target);
    if (k < 1) requestAnimationFrame(step);
    else el.textContent = target;
  })(t0);
}

/* ---------- chrome ---------- */

  $('#fAddr').textContent = CONTACT.addr.join('\n');

  $('#fBook').textContent  = t('fBook');     $('#fBook').href  = CONTACT.calendly;

  $('#fJp').innerHTML = `<option value="">${esc(t('anyJp'))}</option>` +
    ['Native','Fluent','Business','Conversational']
      .map(v=>`<option value="${v}"${state.jp===v?' selected':''}>${esc(lvlTxt(v))}</option>`).join('');
  $('#fPay').innerHTML = `<option value="0">${esc(t('anyPay'))}</option>` +
    [10,13,15,20,25].map(v=>`<option value="${v}"${state.pay===v?' selected':''}>${esc(t('payAbove',{n:v}))}</option>`).join('');
  $('#fRem').innerHTML = `<option value="">${esc(t('anyWork'))}</option>` +
    `<option value="remote"${state.rem==='remote'?' selected':''}>${esc(t('remote3'))}</option>` +
    `<option value="full"${state.rem==='full'?' selected':''}>${esc(t('fullRemote'))}</option>`;

  const allTags = [...new Set(ROLES.flatMap(r=>r.tags))]
    .sort((a,b)=>ROLES.filter(r=>r.tags.includes(b)).length - ROLES.filter(r=>r.tags.includes(a)).length);
  $('#chips').innerHTML = allTags.map(x =>
    `<button class="chip" type="button" aria-pressed="${state.tags.has(x)}" data-tag="${esc(x)}">${esc(tagTxt(x))}</button>`).join('');
  $('#chipsType').innerHTML = ['Internal','Consulting','Vendor','Technology']
    .filter(x => ROLES.some(r=>r.employer_type===x)).map(x =>
    `<button class="chip" type="button" aria-pressed="${state.types.has(x)}" data-type="${esc(x)}">${esc(typeTxt(x))}
     <small>${ROLES.filter(r=>r.employer_type===x).length}</small></button>`).join('');
}
function paintFold(){
  const c = activeCount(), b = $('#fbody');
  $('#controls').classList.toggle('folded', state.folded);
  $('#fold').classList.toggle('active', c > 0);
  $('#foldBadge').textContent = c;
  $('#fold').setAttribute('aria-expanded', !state.folded);
  // Panel height depends on how many chip rows wrap, which depends on screen
  // width and language. Measure it rather than assuming a fixed ceiling.
  b.style.maxHeight = state.folded ? '0px' : b.scrollHeight + 'px';
}
let rz;
window.addEventListener('resize', () => {
  clearTimeout(rz);
  rz = setTimeout(paintFold, 120);
});
function render(){
  const inMatch = state.view === 'match';
  $('#matchPane').hidden = !inMatch;
  $('#main').hidden = inMatch;
  // The view tabs live inside #controls, so hiding the whole bar would strand
  // the visitor in the match tab. Hide only the filter body and the count.
  $('#fbody').style.display = inMatch ? 'none' : '';
  $('#fold').style.display = inMatch ? 'none' : '';
  $('#count').style.display = inMatch ? 'none' : '';
  if (inMatch) return renderMatch();
  if (state.openRole !== null) roleDetail(state.openRole);
  else if (state.openCo) companyDetail(state.openCo);
  else list();
  paintFold();
}
const reset = () => { state.openRole = null; state.openCo = null; state.tab = 0; };
const toTop = () => window.scrollTo({top:0, behavior:'smooth'});

/* ---------- events ---------- */
$('#main').addEventListener('click', e => {
  if (e.target.closest('a')) return;              // JD link opens normally
  if (e.target.closest('[data-back]')){ reset(); render(); return toTop(); }
  const role = e.target.closest('[data-role]');
  if (role){ state.openRole = +role.dataset.role; state.openCo = null; state.tab = 0; render(); return toTop(); }
  const c = e.target.closest('[data-co]');
  if (c){ state.openCo = c.dataset.co; state.openRole = null; render(); return toTop(); }
  const tb = e.target.closest('.tab');
  if (tb){ state.tab = +tb.dataset.t; render(); }
});
$('#main').addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const card = e.target.closest('[role="button"]');
  if (!card) return;

});
$('#fold').addEventListener('click', () => { state.folded = !state.folded; paintFold(); });
$('#vRole').addEventListener('click', () => setView('role'));
$('#vCo').addEventListener('click', () => setView('company'));

}

});
$('#newOnly').addEventListener('click', e => {

});
$('#engOk').addEventListener('click', e => {

  e.currentTarget.setAttribute('aria-pressed', state.engOnly);

});
